name: CI-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Stage for CI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 20, 18]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # ← this one line enables caching
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
