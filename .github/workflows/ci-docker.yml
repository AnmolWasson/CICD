name: CI-docker
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    name: Build Stage for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm" # ← this one line enables caching
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build Docker image
        run: docker build -t cicd-lab .
  docker:
    name: Docker Stage for CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        # run: docker build -t cicd-lab .
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cicd-lab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run Docker container
        run: docker run --rm cicd-lab
