name: CI-docker
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    name: Test Stage for CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm" # ← this one line enables caching
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
  docker:
    name: Docker Stage for CI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        # run: docker build -t cicd-lab .
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true # ← loads image into local daemon (do the build and run together, and add load: true so the image lands in the daemon where docker run can see it)
          tags: cicd-lab:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test of the container
        run: |
          docker run -d --name cicd-lab-container -p 3000:3000 cicd-lab:latest
          sleep 5
          curl -f http://localhost:3000 || (docker logs cicd-lab-container && exit 1)
          docker stop cicd-lab-container
